services:
  tika:
    image: apache/tika:3.0.0.0-full
    restart: unless-stopped
    ports:
      - "0.0.0.0:9988:9998"
    healthcheck:
      test: [ "CMD", "wget", "-O", "/dev/null", "http://localhost:9998/tika" ]
      interval: 30s
      timeout: 20s
      retries: 3
  clamav:
    mem_reservation: 262144000
    mem_limit: 1048576000
    image: ajilaag/clamav-rest
    ports:
      - "0.0.0.0:9888:9000"
    healthcheck:
      test: [ "CMD", "wget", "-O", "/dev/null", "http://localhost:9000/" ]
      interval: 30s
      timeout: 20s
      retries: 3
